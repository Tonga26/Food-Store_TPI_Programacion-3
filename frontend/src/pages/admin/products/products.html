<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../css/global.css">
    <title>Food Store | Gestión de Productos</title>
</head>
<body>
    <div class="page-layout">
        
        <header class="header">
            <h1 class="header__title">🍕 Food Store</h1>
            <nav class="header__nav">
                <ul class="nav__menu" id="nav-menu"></ul>
            </nav>
        </header>

        <aside class="sidebar">
            <div class="sidebar__header">
                <h2 class="sidebar__title sidebar__title--brand">Administración</h2>
                <h3 class="sidebar__subtitle">Panel de Control</h3>
            </div>
            <ul class="sidebar__categories">
                <li class="sidebar__category-item"><a href="../adminHome/admin.html" class="nav__link">📊 Dashboard</a></li>
                <li class="sidebar__category-item"><a href="../categories/categories.html" class="nav__link">📁 Categorías</a></li>
                <li class="sidebar__category-item"><a href="#" class="nav__link nav__link--active">🍔 Productos</a></li>
                <li class="sidebar__category-item"><a href="../orders/orders.html" class="nav__link">📦 Pedidos</a></li>
            </ul>
            <div class="sidebar__divider"></div>
            <ul class="sidebar__categories">
                <li class="sidebar__category-item"><a href="../../store/home/home.html" class="nav__link">🏪 Ver Tienda</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <section class="crud-section">
                <header class="crud-section__header">
                    <h2 class="crud-section__title">Gestión de Productos</h2>
                    <button class="btn btn--success" id="btn-add-product">+ Nuevo Producto</button>
                </header>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div class="modal" id="product-modal" aria-hidden="true">
        <div class="modal__overlay" id="modal-overlay"></div>
        <div class="modal__content modal__content--scrollable">
            <header class="modal__header">
                <h2 class="modal__title" id="modal-title">Nuevo Producto</h2>
                <button class="modal__close-btn" id="modal-close">&times;</button>
            </header>
            <form class="modal__form" id="product-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="product-name" class="form-label">Nombre</label>
                    <input type="text" id="product-name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="product-desc" class="form-label">Descripción</label>
                    <textarea id="product-desc" class="form-textarea" rows="2" required></textarea>
                </div>

                <div class="form-group">
                    <label for="product-price" class="form-label">Precio</label>
                    <input type="number" id="product-price" class="form-input" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="product-stock" class="form-label">Stock</label>
                    <input type="number" id="product-stock" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="product-category" class="form-label">Categoría</label>
                    <select id="product-category" class="form-input" required>
                        </select>
                </div>

                <div class="form-group">
                    <label for="product-img" class="form-label">URL de Imagen</label>
                    <input type="url" id="product-img" class="form-input" required>
                </div>

                <div class="form-group--inline">
                    <input type="checkbox" id="product-available" checked>
                    <label for="product-available" class="form-label">Producto disponible</label>
                </div>

                <button type="submit" class="btn btn--primary btn--block">Guardar</button>
            </form>
        </div>
    </div>

    <script type="module" src="./products.ts"></script>
</body>
</html>
