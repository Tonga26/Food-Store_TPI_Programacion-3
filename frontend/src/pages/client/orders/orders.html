<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/client.css">
    <title>Food Store | Mis Pedidos</title>
</head>
<body>
    <div class="client-layout">
        
        <header class="header">
            <h1 class="header__title">🍕 Food Store</h1>
            <nav class="header__nav">
                <ul class="nav__menu" id="nav-menu"></ul>
            </nav>
        </header>

        <main class="main-content" style="max-width: 1000px; margin: 0 auto; width: 100%;">
            <section class="crud-section">
                <header class="crud-section__header" style="margin-top: 2rem;">
                    <h2 class="crud-section__title">Mis Pedidos</h2>
                    <select id="client-order-filter" class="form-input" style="width: auto; background-color: #e5e7eb; border: none; font-weight: 600;">
                        <option value="all">Todos</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="terminado">Terminados</option>
                        <option value="cancelado">Cancelados</option>
                    </select>
                </header>
                
                <div class="orders-list-view" id="client-orders-container"></div>
            </section>
        </main>
    </div>

    <div class="modal" id="client-order-modal" aria-hidden="true">
        <div class="modal__overlay" id="client-modal-overlay"></div>
        <div class="modal__content modal__content--scrollable" style="max-width: 600px;">
            <header class="modal__header">
                <h2 class="modal__title">Tu Pedido</h2>
                <button class="modal__close-btn" id="client-modal-close">&times;</button>
            </header>
            
            <div class="modal__body">
                <div class="order-info-grid">
                    <div class="order-info-group">
                        <span class="order-info-label">Estado</span>
                        <span id="modal-client-status"></span>
                    </div>
                    <div class="order-info-group">
                        <span class="order-info-label">Fecha</span>
                        <span class="order-info-value" id="modal-client-date"></span>
                    </div>
                    <div class="order-info-group">
                        <span class="order-info-label">Dirección</span>
                        <span class="order-info-value" id="modal-client-address"></span>
                    </div>
                    <div class="order-info-group">
                        <span class="order-info-label">Pago</span>
                        <span class="order-info-value" id="modal-client-payment"></span>
                    </div>
                </div>

                <div class="order-items">
                    <h3 class="order-items__title">🛍️ Productos</h3>
                    <ul class="order-items__list" id="modal-client-items"></ul>
                </div>

                <div class="order-totals">
                    <div class="order-totals__row">
                        <span>Subtotal:</span>
                        <span id="modal-client-subtotal"></span>
                    </div>
                    <div class="order-totals__row">
                        <span>Envío:</span>
                        <span id="modal-client-shipping"></span>
                    </div>
                    <div class="order-totals__row order-totals__row--grand">
                        <span>Total:</span>
                        <span id="modal-client-total"></span>
                    </div>
                </div>

                <div id="modal-client-alert" style="margin-top: 1.5rem;"></div>
            </div>
        </div>
    </div>

    <script type="module" src="./orders.ts"></script>
</body>
</html>
